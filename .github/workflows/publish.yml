# npm trusted publishing via GitHub Actions OIDC.
# Push a v* tag (matching package.json version) to publish: git tag v0.2.0 && git push --tags
# No npm token required: trust is configured per-package on npmjs.com (Publishers -> GitHub Actions).
name: publish.yml

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Manual exchange probe (temp)
        run: |
          ID_TOKEN=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).value))")
          curl -sS -w '\nHTTP_%{http_code}' -X POST -H "Authorization: Bearer $ID_TOKEN" -H 'content-type: application/json' -d '{}' "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/dsh-dingtalk" | sed 's/npm_[A-Za-z0-9]\{8\}[A-Za-z0-9]*/npm_***REDACTED***/g' | tail -3

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "tag v$TAG_VERSION does not match package.json $PKG_VERSION"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: npm publish --provenance --access public
